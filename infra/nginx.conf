resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
upstream backend { zone backend 64k; server ${BACKEND_HOST}:3000 resolve; }
server {
 listen 8080;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/ { proxy_pass http://backend; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; }
 location /socket.io/ { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $http_host; }
}
